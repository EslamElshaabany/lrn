<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: 'Note' }} — {{ site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/notes.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<div class="container">

  <a class="back" href="{{ '/' | relative_url }}">← back to home</a>

  {% if page.topic %}<p class="note-eyebrow">{{ page.topic }}</p>{% endif %}
  <h1 class="note-title">{{ page.title }}</h1>

  <article class="prose">
    {{ content }}
  </article>

</div>
</body>
</html>
